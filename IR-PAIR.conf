# ============================================================================
#  IR-PAIR.conf : keys that IR-PAIR.sh will ask you to pair
# ============================================================================
#  One key per line:     KEY_NAME     Description shown during pairing
#
#  - A line starting with "#" is ignored: the key is NOT paired.
#  - Remove the "#" in front of a key to enable it, then run the script
#    with  args = new  to pair only the keys you just enabled.
#  - Add "#" in front of a key to stop managing it.
#  - Any valid Linux key name (KEY_...) can be added on a new line.
#
#  Note: enabling a key only makes the remote send it. 240-MP (or the
#  system) must react to that key for it to do something.
# ============================================================================


# ---- Navigation (enabled by default) ---------------------------------------
KEY_UP              Navigate up
KEY_DOWN            Navigate down
KEY_LEFT            Navigate left
KEY_RIGHT           Navigate right

#KEY_HOME           Home
#KEY_END            End
#KEY_PAGEUP         Page up
#KEY_PAGEDOWN       Page down
#KEY_TAB            Tab


# ---- Confirm / cancel (enabled by default) ---------------------------------
KEY_ENTER           Select / confirm (OK)
KEY_ESC             Back

#KEY_OK             OK
#KEY_SELECT         Select
#KEY_BACK           Back (browser-style)
#KEY_EXIT           Exit
#KEY_BACKSPACE      Backspace
#KEY_DELETE         Delete


# ---- Playback ---------------------------------------------------------------
KEY_SPACE           Play / pause

#KEY_PLAYPAUSE      Play / pause (media key)
#KEY_PLAY           Play
#KEY_PAUSE          Pause
#KEY_STOP           Stop
#KEY_NEXTSONG       Next track
#KEY_PREVIOUSSONG   Previous track
KEY_FASTFORWARD    Fast forward
KEY_REWIND         Rewind
#KEY_RECORD         Record


# ---- Volume and channels ----------------------------------------------------
KEY_VOLUMEUP       Volume up
KEY_VOLUMEDOWN     Volume down
KEY_MUTE           Mute
#KEY_CHANNELUP      Channel up
#KEY_CHANNELDOWN    Channel down


# ---- Menus and information ---------------------------------------------------
#KEY_MENU           Menu
#KEY_INFO           Information
#KEY_EPG            Program guide
#KEY_FAVORITES      Favorites
#KEY_SUBTITLE       Subtitles
#KEY_AUDIO          Audio track / language


# ---- Color buttons -----------------------------------------------------------
#KEY_RED            Red button
#KEY_GREEN          Green button
#KEY_YELLOW         Yellow button
#KEY_BLUE           Blue button


# ---- Digits -------------------------------------------------------------------
#KEY_0              Digit 0
#KEY_1              Digit 1
#KEY_2              Digit 2
#KEY_3              Digit 3
#KEY_4              Digit 4
#KEY_5              Digit 5
#KEY_6              Digit 6
#KEY_7              Digit 7
#KEY_8              Digit 8
#KEY_9              Digit 9


# ---- Function keys -------------------------------------------------------------
#KEY_F1             F1
#KEY_F2             F2
#KEY_F3             F3
#KEY_F4             F4
#KEY_F5             F5
#KEY_F6             F6
#KEY_F7             F7
#KEY_F8             F8
#KEY_F9             F9
#KEY_F10            F10
#KEY_F11            F11
#KEY_F12            F12


# ---- Power -----------------------------------------------------------------------
# The system itself may react to this key (for example by shutting down).
KEY_POWER          Power
